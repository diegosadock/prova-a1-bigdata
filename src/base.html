function startGame(mode){const allocations=mode==='focus'?[["Big Data",9],["Raciocínio Lógico",6]]:[["Big Data",4],["Raciocínio Lógico",3],["Inteligência Artificial",2],["Business Intelligence",2],["Coleta de Dados",2],["Ciência de Dados",1],["Ética e Confiança",1]];let pick=[];allocations.forEach(([m,n])=>pick.push(...shuffle(DATA.questions.filter(q=>q.module===m)).slice(0,n)));pick.sort((a,b)=>a.difficulty-b.difficulty||Math.random()-.5);state.game={mode,questions:pick.map(q=>({...q,options:shuffle(q.options.map((t,i)=>({t,correct:i===q.correct}))).map(x=>x.t),answer:null})),stage:0,selected:null,status:'playing',used:{half:false,tip:false,skip:false},hidden:[],tip:false};state.game.questions.forEach((q,i)=>{const orig=DATA.questions.find(x=>x.id===q.id);q.correct=q.options.indexOf(orig.options[orig.correct])});navigate('game')}

function renderFlash(){if(!state.flashQueue.length)return `<div class="eyebrow">Memorização ativa</div><h1>Flashcards</h1><p class="muted">Tente lembrar antes de virar o cartão. Marque "Lembrei" para aumentar o intervalo de revisão, ou "Rever" para praticar de novo depois.</p><div class="grid g3" style="margin-bottom:24px">${card(`<div class="label">Cartões no total</div><div class="statnum">${DATA.cards.length}</div>`)}${card(`<div class="label">Estudados</div><div class="statnum">${Object.keys(state.cards).length}</div>`)}${card(`<div class="label">Domínio crescente</div><div class="statnum">${Object.values(state.cards).filter(c=>c.box>=2).length}</div>`)}</div><h3>Escolha o baralho</h3><div class="filtertabs"><button class="tab" data-startflash="Todos">Todos os temas</button>${DATA.modules.map(m=>`<button class="tab" data-startflash="${esc(m.id)}">${esc(m.label)}</button>`).join('')}</div><div class="notice">O progresso é salvo localmente no navegador. A agenda de revisão usa intervalos simplificados; não substitui um sistema de repetição espaçada completo.</div>`;
let c=flashCard(),rev=state.flashRevealed,done=state.flashIndex;return `<div class="eyebrow">Flashcards / ${esc(state.flashTopic)}</div><div class="row space"><h1>Memorize praticando</h1><span class="pill">${done+1}/${state.flashQueue.length}</span></div>${progress(100*done/state.flashQueue.length)}<div class="studycard ${rev?'revealed':''}" data-action="flip-card" role="button" tabindex="0" aria-label="Virar cartão"><div class="tiny">${rev?'Resposta':'Pergunta'} · toque para virar</div><div class="${rev?'back':'front'}">${esc(rev?c.back:c.front)}</div><div class="small muted" style="margin-top:23px">${rev?esc(c.source):esc(c.module)}</div></div><div class="row" style="justify-content:center">${rev?`${btn('Preciso rever',`data-flashmark="0"`,'danger')}${btn('✓ Lembrei!',`data-flashmark="1"`,'good')}`:btn('Mostrar resposta ↻',`data-action="flip-card"`,'primary')}${btn('Sair do baralho',`data-action="stop-flash"`,'ghost')}</div><div class="small muted" style="text-align:center;margin-top:17px">Só marque “Lembrei” se recuperou a resposta sem olhar.</div>`}
function renderReview(){let errors=Object.entries(state.mistakes).sort((a,b)=>b[1].count-a[1].count);let totals=Object.values(state.right).reduce((a,b)=>a+b,0), misses=errors.reduce((a,[k,v])=>a+v.count,0),pctCorrect=totals+misses?Math.round(totals*100/(totals+misses)):0;return `<div class="eyebrow">Diagnóstico e revisão</div><h1>Seu desempenho</h1><p class="muted">Visualize seu progresso e retome os conceitos que ainda precisam de treino. Os dados ficam guardados neste navegador.</p><div class="grid g3">${card(`<div class="label">Lições concluídas</div><div class="statnum">${completed()}/${DATA.lessons.length}</div>`)}${card(`<div class="label">Taxa de acerto observada</div><div class="statnum">${totals+misses?pctCorrect+'%':'—'}</div><div class="small muted">Baseada em mini-desafios e respostas do jogo</div>`)}${card(`<div class="label">Partidas do quiz</div><div class="statnum">${state.games.length}</div>`)}</div><div class="sectionhead"><h2>Progresso por trilha</h2></div><div class="grid g2">${DATA.modules.map(m=>{const ls=DATA.lessons.filter(l=>l.module===m.id),n=ls.filter(l=>state.done[l.id]).length;return card(`<div class="row space"><h3>${esc(m.label)}</h3><span class="small muted">${n}/${ls.length}</span></div>${progress(100*n/ls.length)}<div style="margin-top:15px">${btn('Revisar aulas',`data-openmodule="${esc(m.id)}"`,'soft')}</div>`)}).join('')}</div><div class="sectionhead"><h2>Caderno de erros</h2><span class="badgecount">${errors.length} conceito(s) registrado(s)</span></div>${errors.length?`<div class="errorlist">${errors.slice(0,18).map(([k,e])=>`<div class="erroritem"><div><b style="font-size:13px">${esc(e.title)}</b><div class="small muted">${esc(e.module)} · ${e.count} erro(s)</div><p style="font-size:12px;margin:8px 0 0;color:#536078">${esc(e.detail)}</p></div><span class="pill baixa">Revisar</span></div>`).join('')}</div>`:'<div class="empty">Nenhum erro registrado ainda. Faça mini-desafios e partidas para criar seu diagnóstico.</div>'}<div class="sectionhead"><h2>Revisão de 5 minutos</h2></div><div class="card"><h3>O essencial antes da prova</h3><div class="grid g2" style="margin-top:15px"><div><div class="label">Big Data</div><p class="small">Conjuntos tão grandes ou complexos que desafiam o processamento tradicional. <b>5 Vs: Volume, Velocidade, Variedade, Veracidade e Valor.</b></p></div><div><div class="label">Bailly</div><p class="small"><b>Dedutivo</b> = geral → específico; <b>Indutivo</b> = casos → generalização; <b>Abdutivo</b> = observação → hipótese; <b>Analítico</b> = dividir; <b>Crítico</b> = avaliar evidências.</p></div><div><div class="label">IA e ciência dos dados</div><p class="small">Data Science integra computação, matemática, estatística e negócio. IA inclui ML, e ML inclui DL.</p></div><div><div class="label">BI e coleta</div><p class="small">BI coleta, analisa, gera insights e acompanha resultados. Defina objetivos e KPIs para aproveitar a coleta.</p></div></div><div class="notice warning">Ética/proteção aparece nos arquivos, mas foi tratada como prioridade menor porque um colega disse que não cairá. Isso não é confirmação oficial.</div></div><div style="margin-top:25px">${btn('Recomeçar meu progresso',`data-action="reset-progress"`,'ghost')}</div>`}
function openModal(html){$('#modalRoot').innerHTML=`<div class="modalveil" id="veil"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;$('#veil').addEventListener('click',e=>{if(e.target.id==='veil')closeModal()})}
function closeModal(){$('#modalRoot').innerHTML=''}
function showSource(){openModal(`<div class="row space"><h2>Fontes e limites</h2><button class="mini-btn" data-action="close-modal">Fechar ×</button></div><p>O aplicativo foi produzido a partir dos quatro arquivos enviados, com <b>182 páginas/slides</b> no total:</p><p class="small"><b>Aula 1 (89 páginas)</b> — Data Science, Big Data, IA, Machine Learning, Business Intelligence.</p><p class="small"><b>Aula 2 (45 páginas)</b> — Coleta de dados, KPIs, objetivos, campanhas e ferramentas.</p><p class="small"><b>Aula 3 (31 páginas)</b> — Ética, governança, consentimento, discriminação, segurança.</p><p class="small"><b>Aula 5 — Bailly (17 páginas)</b> — Raciocínios dedutivo, indutivo, abdutivo, analítico e crítico.</p><div class="notice">As lições trazem sínteses fiéis do material e complementos pedagógicos; exemplos e exercícios são autorais, não questões oficiais da prova.</div><p class="small muted" style="margin-top:14px">Aplicativo offline: a função “Perguntar ao ChatGPT” prepara um prompt contextualizado para você copiar. Respostas novas de IA não são geradas dentro do arquivo, pois não há conexão com modelo de IA.</p>`)}
function askAi(){let l=getLesson(state.selectedLesson),prompt=`Estou estudando para a A1 de Análise de Dados e Big Data. O material da ${l.src}, páginas ${l.pages}, apresenta o conceito: ${l.title}. Definição/síntese do PDF: ${l.definition}. Não entendi bem essa parte. Explique de três maneiras (muito simples, com exemplo cotidiano e com analogia de programação), compare com conceitos parecidos, destaque uma pegadinha de prova e depois me faça uma pergunta sem revelar a resposta. Diferencie o que vem do material da explicação complementar.`;openModal(`<div class="row space"><h2>Peça ajuda sobre esta aula</h2><button class="mini-btn" data-action="close-modal">Fechar ×</button></div><p class="muted">Preparei uma pergunta contextualizada sobre <b>${esc(l.title)}</b>. Copie para esta conversa do ChatGPT e eu posso aprofundar a explicação.</p><textarea id="aiPrompt">${esc(prompt)}</textarea><div class="row" style="margin-top:14px">${btn('Copiar pergunta',`data-action="copy-prompt"`,'primary')}<a class="btn ghost" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">Abrir ChatGPT ↗</a></div><p class="small muted" style="margin-top:14px">No arquivo offline, este botão não envia mensagens automaticamente. Não é necessário informar uma chave de API.</p>`)}
async function copyPrompt(){const t=$('#aiPrompt');try{await navigator.clipboard.writeText(t.value);alert('Pergunta copiada! Cole na conversa do ChatGPT.')}catch(e){t.focus();t.select();document.execCommand('copy');alert('Texto selecionado: você pode copiá-lo e colar no ChatGPT.')}}
function resetProgress(){if(confirm('Deseja realmente apagar neste navegador as aulas concluídas, erros, jogos e flashcards?')){state.done={};state.lab={};state.cards={};state.mistakes={};state.right={};state.games=[];state.game=null;persist();navigate('home')}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-nav],[data-openlesson],[data-openmodule],[data-action],[data-labanswer],[data-startgame],[data-gameanswer],[data-gamehelp],[data-startflash],[data-flashmark],[data-topic]');if(!b)return;if(b.dataset.nav){navigate(b.dataset.nav);return}if(b.dataset.openlesson){openLesson(b.dataset.openlesson);return}if(b.dataset.openmodule){let lesson=DATA.lessons.find(l=>l.module===b.dataset.openmodule);if(lesson)openLesson(lesson.id);return}if(b.dataset.topic){let lesson=DATA.lessons.find(l=>l.module===b.dataset.topic);if(lesson)openLesson(lesson.id);return}if('labanswer'in b.dataset){labAnswer(+b.dataset.labanswer);return}if(b.dataset.startgame){startGame(b.dataset.startgame);return}if('gameanswer'in b.dataset){chooseGameOption(+b.dataset.gameanswer);return}if(b.dataset.gamehelp){gameHelp(b.dataset.gamehelp);return}if('startflash'in b.dataset){initFlash(b.dataset.startflash);return}if('flashmark'in b.dataset){markFlash(b.dataset.flashmark==='1');return}switch(b.dataset.action){case'help':state.lessonHelp=!state.lessonHelp;state.labAnswered=false;render();break;case'tech':state.lessonTech=!state.lessonTech;state.labAnswered=false;render();break;case'ask-ai':askAi();break;case'open-source':showSource();break;case'close-modal':closeModal();break;case'copy-prompt':copyPrompt();break;case'finish-lesson':finishLesson();break;case'next-lesson':nextLesson();break;case'game-next':nextGameStage();break;case'reset-game':resetGame();break;case'flip-card':state.flashRevealed=!state.flashRevealed;render();break;case'stop-flash':state.flashQueue=[];render();break;case'reset-progress':resetProgress();break;}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.studycard')){e.preventDefault();state.flashRevealed=!state.flashRevealed;render()}if(e.key==='Escape')closeModal()});$('#mobileSelect').addEventListener('change',e=>navigate(e.target.value));render();
</script>
</body>
</html>
